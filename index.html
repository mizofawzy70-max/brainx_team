    // Load data from Supabase (Table named 'brainx_store')
    async function loadDB() {
      try {
        const { data, error } = await supabaseClient
          .from('brainx_store')
          .select('payload')
          .eq('id', 1)
          .single();

        if (data && data.payload) {
          dbState = data.payload;
        } else {
          // If table row doesn't exist yet, insert default seed
          await supabaseClient.from('brainx_store').upsert({ id: 1, payload: DEFAULT_DB });
          dbState = JSON.parse(JSON.stringify(DEFAULT_DB));
        }
      } catch (err) {
        console.warn("Supabase fetch notice, falling back to local memory:", err);
      }
      render();
    }

    // Save data to Supabase

      render(); // Immediate UI update

    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      const styles = {
        success: "border-gold-500/60 bg-obsidian-900/95 text-gold-300",
        error: "border-red-500/60 bg-obsidian-900/95 text-red-300",
        warning: "border-amber-500/60 bg-obsidian-900/95 text-amber-200"
      };
      const icons = {
        success: "check-circle-2",
        error: "alert-octagon",
        warning: "clock"
      };

      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-xl border shadow-2xl backdrop-blur-md animate-enter ${styles[type] || styles.success}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i>
        <p class="text-sm font-semibold leading-snug">${message}</p>
      `;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(10px)";
        toast.style.transition = "all 0.3s ease";
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    function handleAvatarUpload(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        if (file.size > 900 * 1024) {
          showToast("يفضل اختيار صورة أقل من 900 كيلوبايت لضمان سرعة الحفظ.", "warning");
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          joinAvatarPreview = e.target.result;
          const imgEl = document.getElementById("join-avatar-img");
          if (imgEl) imgEl.src = joinAvatarPreview;
        };
        reader.readAsDataURL(file);
      }
    }

      const password = document.getElementById("join-pass").value.trim();
      const workMode = document.querySelector('input[name="workMode"]:checked')?.value || "Software";
      const skills = document.getElementById("join-skills").value.trim();
      const bio = document.getElementById("join-bio").value.trim();
      const portfolio = document.getElementById("join-portfolio").value.trim();

      if (academicId === ADMIN_ID || dbState.users.some(u => u.academicId === academicId)) {
        showToast("هذا الرقم الأكاديمي مسجل بالفعل في النظام!", "error");
        return;
      }

      const newApplicant = {
        academicId,
        password,
        name,
        workMode,
        status: "pending",
        avatar: joinAvatarPreview || `https://api.dicebear.com/9.x/avataaars/svg?seed=${encodeURIComponent(academicId)}&backgroundColor=18181f`,
        bio: bio || "عضو طموح يرغب في الانضمام لتيم BrainX والمساهمة في تطوير المشاريع.",
        skills: skills || "Teamwork, Problem Solving",
        portfolio: portfolio || "",
        score: 0,
        scoreLogs: [],
        joinedAt: new Date().toLocaleDateString("ar-EG")
      };

      dbState.users.unshift(newApplicant);
      joinAvatarPreview = "";
      saveState();

      authTab = "login";
      showToast("تم إرسال طلب انضمامك بنجاح للسحابة! طلبك الآن قيد مراجعة الليدر.", "success");

    function saveProjectDetails(e) {
      e.preventDefault();

      const description = document.getElementById("proj-desc").value.trim();
      const deadline = document.getElementById("proj-deadline").value;
      const progressVal = parseInt(document.getElementById("proj-progress").value, 10);
      const progress = isNaN(progressVal) ? 0 : Math.max(0, Math.min(100, progressVal));
      const techRaw = document.getElementById("proj-tech").value.trim();
      const goalsRaw = document.getElementById("proj-goals").value.trim();

      dbState.project = {
        title,
        description,
        deadline,
        progress,
        techStack: techRaw ? techRaw.split(",").map(s => s.trim()).filter(Boolean) : [],
        goals: goalsRaw ? goalsRaw.split("\n").map(s => s.trim()).filter(Boolean) : []
      };
      saveState();
      showToast("تم تحديث تفاصيل المشروع وحفظها سحابياً لجميع الأعضاء!", "success");
    }

    function assignNewTask(e) {
      e.preventDefault();
      const memberId = document.getElementById("task-member").value;
      const title = document.getElementById("task-title").value.trim();
      const description = document.getElementById("task-desc").value.trim();
      const deadline = document.getElementById("task-deadline").value;
      const priority = document.getElementById("task-priority").value;

      if (!memberId) {
        showToast("يرجى اختيار عضو لإسناد التاسك إليه.", "error");
        return;
      }

      dbState.tasks.unshift({
        id: "t_" + Date.now(),
        memberId,
        title,
        description,
        deadline,
        priority,
        status: "قيد التنفيذ",
        submissionLink: "",
        submissionNote: ""
      });

      saveState();
      const member = dbState.users.find(u => u.academicId === memberId);
      showToast(`تم إرسال التاسك الخاص إلى ${member ? member.name : memberId} بنجاح!`, "success");

    function deleteTask(taskId) {
      dbState.tasks = dbState.tasks.filter(t => t.id !== taskId);

      showToast("تم حذف التاسك.", "warning");

    function adjustMemberScore(academicId, delta) {
      const user = dbState.users.find(u => u.academicId === academicId);
      if (!user) return;

      const reasonInput = document.getElementById(`reason-${academicId}`);
      const customReason = reasonInput ? reasonInput.value.trim() : "";

      const oldScore = user.score;
      const newScore = Math.max(0, Math.min(60, oldScore + delta));
      const actualDiff = newScore - oldScore;

      if (actualDiff === 0) {
        showToast(delta > 0 ? "العضو وصل بالفعل للحد الأقصى (60 درجة)!" : "العضو عند الحد الأدنى (0 درجة).", "warning");
        return;
      }

      user.score = newScore;
      user.scoreLogs.unshift({
        delta: actualDiff,
        reason: customReason || (actualDiff > 0 ? "إضافة نقاط تميز وأداء" : "خصم نقاط تقييم"),
        date: new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" })
      });

      if (reasonInput) reasonInput.value = "";
      saveState();
      showToast(`تم تحديث تقييم ${user.name} إلى ${newScore} / 60`, "success");
    }

    function applyCustomScore(academicId) {
      const inputEl = document.getElementById(`custom-score-${academicId}`);
      if (!inputEl) return;
      const targetVal = parseInt(inputEl.value, 10);
      if (isNaN(targetVal)) {
        showToast("يرجى إدخال رقم صحيح بين 0 و 60.", "error");
        return;
      }
      const user = dbState.users.find(u => u.academicId === academicId);
      if (!user) return;
      const clamped = Math.max(0, Math.min(60, targetVal));
      const diff = clamped - user.score;
      if (diff === 0) return;
      adjustMemberScore(academicId, diff);
    }

                    </div>
                    <p class="text-zinc-300 text-sm leading-relaxed mb-6 max-w-xl">
                      أهلاً بك يا بطل في منظومة العمل السحابية. تابع مهامك المطلوبة، واطلع على تفاصيل المشروع والمستهدفات المشتركة لتحقيق المركز الأول! 🚀
                    </p>
                  </div>

                  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <div class="p-3.5 rounded-2xl bg-obsidian-950 border border-gold-500/25">
                      <span class="block text-xs text-zinc-400 mb-1">تقييمك الحالي</span>
                      <span class="text-xl font-mono font-black text-gold-400">${user.score} <span class="text-xs text-zinc-500">/ 60</span></span>
                    </div>
                    <div class="p-3.5 rounded-2xl bg-obsidian-950 border border-gold-500/25">
                      <span class="block text-xs text-zinc-400 mb-1">التخصص</span>
                      <span class="text-sm font-bold text-white">${user.workMode}</span>
                    </div>
                    <div class="col-span-2 sm:col-span-1 p-3.5 rounded-2xl bg-obsidian-950 border border-gold-500/25">
                      <span class="block text-xs text-zinc-400 mb-1">المهام المسندة</span>
                      <span class="text-xl font-mono font-black text-sky-400">${dbState.tasks.filter(t => t.memberId === user.academicId).length}</span>
                    </div>
                  </div>
                </div>

                <!-- Top 3 Leaderboard Podium -->
                <div class="glass-card rounded-3xl p-6 border border-gold-500/30 flex flex-col justify-between">
                  <div>
                    <h3 class="text-base font-black text-white mb-4 flex items-center gap-2">
                      <i data-lucide="award" class="w-5 h-5 text-gold-400"></i> لوحة الشرف (Top Members)
                    </h3>
                    <div class="space-y-3">
                      ${top3.map((m, idx) => `
                        <div class="flex items-center justify-between p-3 rounded-2xl bg-obsidian-950 border border-zinc-800">
                          <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center font-mono text-xs font-bold ${idx === 0 ? 'bg-amber-500 text-obsidian-950' : idx === 1 ? 'bg-zinc-300 text-obsidian-950' : 'bg-amber-700 text-white'}">${idx + 1}</span>
                            <img src="${m.avatar}" class="w-9 h-9 rounded-xl object-cover border border-gold-500/30" />
                            <div>
                              <h4 class="text-xs font-bold text-white">${m.name}</h4>
                              <span class="text-[10px] text-zinc-400">${m.workMode}</span>
                            </div>
                          </div>
                          <span class="font-mono font-bold text-gold-400 text-xs">${m.score} / 60</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                  <div class="mt-4 pt-3 border-t border-zinc-800 text-center">
                    <span class="text-[11px] text-zinc-400">استمر في إنجاز مهامك لترتقي في القمة! ✨</span>
                  </div>
                </div>

              </div>

              <!-- Project Overview Card -->
              <div class="glass-card rounded-3xl p-6 sm:p-8 border border-gold-500/30">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-zinc-800">
                  <div>
                    <span class="px-3 py-1 rounded-full text-xs font-bold bg-gold-500/15 text-gold-300 border border-gold-500/30 inline-block mb-2">المشروع الحالي للتيم</span>
                    <h3 class="text-2xl font-black text-white">${dbState.project.title}</h3>
                  </div>
                  <div class="flex items-center gap-4 bg-obsidian-950 px-4 py-3 rounded-2xl border border-zinc-800">
                    <div class="text-left">
                      <span class="block text-xs text-zinc-400">نسبة الإنجاز الكلية</span>
                      <span class="font-mono font-bold text-gold-400 text-lg">${dbState.project.progress}%</span>
                    </div>
                    <div class="w-24 h-2.5 rounded-full bg-obsidian-900 overflow-hidden">
                      <div class="h-full bg-gradient-to-r from-amber-600 to-gold-400 rounded-full" style="width: ${dbState.project.progress}%"></div>
                    </div>
                  </div>
                </div>

                <div class="py-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <h4 class="text-sm font-bold text-zinc-300 mb-2 flex items-center gap-2">
                      <i data-lucide="info" class="w-4 h-4 text-gold-400"></i> وصف المشروع
                    </h4>
                    <p class="text-sm text-zinc-300 leading-relaxed bg-obsidian-950/60 p-4 rounded-2xl border border-zinc-800">${dbState.project.description}</p>
                  </div>
                  <div>
                    <h4 class="text-sm font-bold text-zinc-300 mb-2 flex items-center gap-2">
                      <i data-lucide="target" class="w-4 h-4 text-gold-400"></i> مستهدفات الفريق
                    </h4>
                    <ul class="space-y-2 bg-obsidian-950/60 p-4 rounded-2xl border border-zinc-800 text-xs text-zinc-300">
                      ${dbState.project.goals.map(g => `<li class="flex items-start gap-2"><span class="text-gold-400 font-bold">•</span> ${g}</li>`).join('')}
                    </ul>
                  </div>
                </div>

                <div class="pt-4 border-t border-zinc-800 flex flex-wrap items-center justify-between gap-3">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-xs font-bold text-zinc-400 mr-2">التقنيات:</span>
                    ${dbState.project.techStack.map(tech => `<span class="px-3 py-1 rounded-lg bg-obsidian-950 border border-gold-500/25 text-gold-300 text-xs font-mono font-semibold">${tech}</span>`).join('')}
                  </div>
                  <span class="text-xs text-zinc-400 font-mono">الموعد النهائي: ${dbState.project.deadline}</span>
                </div>
              </div>

              <!-- My Tasks Section -->
              <div class="space-y-4">
                <h3 class="text-xl font-black text-white flex items-center gap-2">
                  <i data-lucide="check-square" class="w-5 h-5 text-gold-400"></i> مهامي المطلوبة (${dbState.tasks.filter(t => t.memberId === user.academicId).length})
                </h3>

                ${dbState.tasks.filter(t => t.memberId === user.academicId).length === 0 ? `
                  <div class="glass-card rounded-2xl p-10 text-center border border-zinc-800">
                    <div class="w-14 h-14 rounded-full bg-obsidian-950 border border-zinc-800 flex items-center justify-center mx-auto mb-3 text-zinc-500">
                      <i data-lucide="check-circle-2" class="w-7 h-7"></i>
                    </div>
                    <h4 class="text-base font-bold text-white mb-1">ليس لديك مهام معلقة حالياً</h4>
                    <p class="text-xs text-zinc-400">سيقوم الليدر بإسناد مهام جديدة لك قريباً.</p>
                  </div>
                ` : `
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${dbState.tasks.filter(t => t.memberId === user.academicId).map(t => `
                      <div class="glass-card rounded-2xl p-5 border border-gold-500/30 flex flex-col justify-between gap-4">
                        <div>
                          <div class="flex items-center justify-between gap-2 mb-2">
                            <h4 class="text-base font-bold text-white">${t.title}</h4>
                            ${getTaskStatusBadge(t.status)}
                          </div>
                          <p class="text-xs text-zinc-300 leading-relaxed mb-3 bg-obsidian-950 p-3 rounded-xl border border-zinc-800">${t.description}</p>
                          <div class="flex items-center justify-between text-xs font-mono text-zinc-400 mb-4">
                            <span>الموعد النهائي: ${t.deadline}</span>
                            <span class="px-2 py-0.5 rounded bg-obsidian-950 border border-zinc-800">${t.priority}</span>
                          </div>

                          <!-- Submission Form for Member -->
                          <form onsubmit="submitTaskByMember(event, '${t.id}')" class="space-y-2.5 bg-obsidian-950/80 p-3.5 rounded-xl border border-zinc-800">
                            <p class="text-xs font-bold text-gold-300 flex items-center gap-1.5">
                              <i data-lucide="upload-cloud" class="w-4 h-4"></i> تسليم التاسك لليدر
                            </p>
                            <input type="url" id="sub-link-${t.id}" value="${t.submissionLink || ''}" required placeholder="رابط الملف أو GitHub أو Google Drive..." class="w-full px-3 py-2 rounded-lg bg-obsidian-900 border border-zinc-800 text-white placeholder-zinc-600 text-xs font-mono focus:outline-none focus:border-gold-500 transition" />
                            <input type="text" id="sub-note-${t.id}" value="${t.submissionNote || ''}" placeholder="ملاحظات التسليم (اختياري)..." class="w-full px-3 py-2 rounded-lg bg-obsidian-900 border border-zinc-800 text-white placeholder-zinc-600 text-xs focus:outline-none focus:border-gold-500 transition" />
                            <button type="submit" class="w-full gold-btn py-2 rounded-lg text-xs flex items-center justify-center gap-1 shadow-md">
                              <i data-lucide="check" class="w-3.5 h-3.5"></i> تأكيد وإرسال التسليم
                            </button>
                          </form>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>

            </div>
          `}

        </main>
      `;

      if (window.lucide) lucide.createIcons();
    }
  </script>
</body>
</html>
