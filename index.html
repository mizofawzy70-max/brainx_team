  <style>
    body {

      color: #F4F4F6;
      font-family: 'Cairo', 'Tajawal', sans-serif;
      overflow-x: hidden;
    }

    /* Gold Metallic Gradient Text & Surfaces */
    .gold-text-gradient {
      background: linear-gradient(135deg, #FDE68A 0%, #d4af37 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #d4af37 55%, #B48A1E 100%);
      color: #09090b;
      font-weight: 800;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gold-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px -4px rgba(212, 175, 55, 0.45);
      filter: brightness(1.06);
    }

    .gold-btn:active {
      transform: translateY(0);
    }

    .glass-card {
      background: rgba(17, 17, 21, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.18);
    }

    .glass-card-hover {
      transition: all 0.25s ease;
    }

    .glass-card-hover:hover {
      border-color: rgba(212, 175, 55, 0.48);
      box-shadow: 0 12px 32px -10px rgba(212, 175, 55, 0.2);
    }

    /* Subtle Engineering Grid Background */
    .bg-grid-pattern {
      background-size: 42px 42px;
      background-image: 
        linear-gradient(to right, rgba(212, 175, 55, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #272730;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d4af37;
    }

    /* Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-enter {
      animation: fadeSlideUp 0.35s ease-out forwards;
    }

</head>

    // ==========================================
    // 2. APPLICATION STATE & LOCALSTORAGE SYNC
    // ==========================================
    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          return JSON.parse(raw);
        }
      } catch (err) {
        console.warn("Storage read fallback:", err);
      }
      const seeded = JSON.parse(JSON.stringify(DEFAULT_DB));
      saveDBToStorage(seeded);
      return seeded;
    }

    function saveDBToStorage(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {
        console.warn("Storage write notice:", err);
      }
    }

    let dbState = loadDB();
    let currentUser = null; // { role: 'admin' | 'member', data: userObj }
    let activeTab = "requests";
    let authTab = "login"; // 'login' | 'join'

    function saveState() {
      saveDBToStorage(dbState);

    // ==========================================
    // 3. UI HELPERS (Toast, Modals, Badges)
    // ==========================================
    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      const styles = {
        success: "border-gold-500/60 bg-obsidian-900/95 text-gold-300",
        error: "border-red-500/60 bg-obsidian-900/95 text-red-300",
        warning: "border-amber-500/60 bg-obsidian-900/95 text-amber-200"
      };
      const icons = {
        success: "check-circle-2",
        error: "alert-octagon",
        warning: "clock"
      };

      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-xl border shadow-2xl backdrop-blur-md animate-enter ${styles[type] || styles.success}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i>
        <p class="text-sm font-semibold leading-snug">${message}</p>
      `;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(10px)";
        toast.style.transition = "all 0.3s ease";
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById("modal-backdrop");
      const content = document.getElementById("modal-content");
      content.innerHTML = htmlContent;
      backdrop.classList.remove("hidden");
      backdrop.classList.add("flex");
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const backdrop = document.getElementById("modal-backdrop");
      backdrop.classList.add("hidden");
      backdrop.classList.remove("flex");
    }

    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") closeModal();
    });

        currentUser = {
          role: "admin",
          data: { name: "ليدر تيم برينكس", academicId: ADMIN_ID }

        activeTab = "requests";

        render();
        return;
      }

      const foundUser = dbState.users.find(u => u.academicId === id && u.password === pass);

        showToast("الرقم الأكاديمي أو كلمة المرور غير صحيحة!", "error");

    function handleAvatarUpload(input) {

        }
        const reader = new FileReader();
        reader.onload = function(e) {
          joinAvatarPreview = e.target.result;
          const imgEl = document.getElementById("join-avatar-img");
          if (imgEl) imgEl.src = joinAvatarPreview;
        };
        reader.readAsDataURL(file);
      }
    }

    function handleJoinRequest(e) {
      e.preventDefault();
      const name = document.getElementById("join-name").value.trim();
      const academicId = document.getElementById("join-id").value.trim();
      const password = document.getElementById("join-pass").value.trim();
      const workMode = document.querySelector('input[name="workMode"]:checked')?.value || "Software";
      const skills = document.getElementById("join-skills").value.trim();
      const bio = document.getElementById("join-bio").value.trim();
      const portfolio = document.getElementById("join-portfolio").value.trim();

      if (academicId === ADMIN_ID || dbState.users.some(u => u.academicId === academicId)) {
        showToast("هذا الرقم الأكاديمي مسجل بالفعل في النظام!", "error");
        return;
      }

      const newApplicant = {
        academicId,
        password,
        name,
        workMode,
        status: "pending",
        avatar: joinAvatarPreview || `https://api.dicebear.com/9.x/avataaars/svg?seed=${encodeURIComponent(academicId)}&backgroundColor=18181f`,
        bio: bio || "عضو طموح يرغب في الانضمام لتيم BrainX والمساهمة في تطوير المشاريع.",
        skills: skills || "Teamwork, Problem Solving",
        portfolio: portfolio || "",
        score: 0,
        scoreLogs: [],
        joinedAt: new Date().toLocaleDateString("ar-EG")
      };

      dbState.users.unshift(newApplicant);
      joinAvatarPreview = "";
      saveState();

      authTab = "login";
      showToast("تم إرسال طلب انضمامك بنجاح! طلبك الآن قيد مراجعة الليدر.", "success");
      render();
    }

    function saveProjectDetails(e) {
      e.preventDefault();
      const title = document.getElementById("proj-title").value.trim();
      const description = document.getElementById("proj-desc").value.trim();
      const deadline = document.getElementById("proj-deadline").value;
      const progressVal = parseInt(document.getElementById("proj-progress").value, 10);
      const progress = isNaN(progressVal) ? 0 : Math.max(0, Math.min(100, progressVal));
      const techRaw = document.getElementById("proj-tech").value.trim();
      const goalsRaw = document.getElementById("proj-goals").value.trim();

      dbState.project = {
        title,
        description,
        deadline,
        progress,
        techStack: techRaw ? techRaw.split(",").map(s => s.trim()).filter(Boolean) : [],
        goals: goalsRaw ? goalsRaw.split("\n").map(s => s.trim()).filter(Boolean) : []
      };
      saveState();
      showToast("تم تحديث تفاصيل المشروع ونشرها لجميع الأعضاء!", "success");
    }

    function assignNewTask(e) {
      e.preventDefault();
      const memberId = document.getElementById("task-member").value;
      const title = document.getElementById("task-title").value.trim();
      const description = document.getElementById("task-desc").value.trim();
      const deadline = document.getElementById("task-deadline").value;
      const priority = document.getElementById("task-priority").value;

      if (!memberId) {
        showToast("يرجى اختيار عضو لإسناد التاسك إليه.", "error");
        return;
      }

      dbState.tasks.unshift({
        id: "t_" + Date.now(),
        memberId,
        title,
        description,
        deadline,
        priority,
        status: "قيد التنفيذ",
        submissionLink: "",
        submissionNote: ""
      });

      saveState();
      const member = dbState.users.find(u => u.academicId === memberId);
      showToast(`تم إرسال التاسك الخاص إلى ${member ? member.name : memberId} بنجاح!`, "success");
    }

    function deleteTask(taskId) {
      dbState.tasks = dbState.tasks.filter(t => t.id !== taskId);
      saveState();
      showToast("تم حذف التاسك.", "warning");
    }

    function adjustMemberScore(academicId, delta) {
      const user = dbState.users.find(u => u.academicId === academicId);
      if (!user) return;

      const reasonInput = document.getElementById(`reason-${academicId}`);
      const customReason = reasonInput ? reasonInput.value.trim() : "";

      const oldScore = user.score;
      const newScore = Math.max(0, Math.min(60, oldScore + delta));
      const actualDiff = newScore - oldScore;

      if (actualDiff === 0) {
        showToast(delta > 0 ? "العضو وصل بالفعل للحد الأقصى (60 درجة)!" : "العضو عند الحد الأدنى (0 درجة).", "warning");
        return;
      }

      user.score = newScore;
      user.scoreLogs.unshift({
        delta: actualDiff,
        reason: customReason || (actualDiff > 0 ? "إضافة نقاط تميز وأداء" : "خصم نقاط تقييم"),
        date: new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" })
      });

      if (reasonInput) reasonInput.value = "";
      saveState();
      showToast(`تم تحديث تقييم ${user.name} إلى ${newScore} / 60`, "success");
    }

    function applyCustomScore(academicId) {
      const inputEl = document.getElementById(`custom-score-${academicId}`);
      if (!inputEl) return;
      const targetVal = parseInt(inputEl.value, 10);
      if (isNaN(targetVal)) {
        showToast("يرجى إدخال رقم صحيح بين 0 و 60.", "error");
        return;
      }
      const user = dbState.users.find(u => u.academicId === academicId);
      if (!user) return;
      const clamped = Math.max(0, Math.min(60, targetVal));
      const diff = clamped - user.score;
      if (diff === 0) return;
      adjustMemberScore(academicId, diff);
    }

                  ${top3.map((leader, i) => `
                    <div class="flex items-center gap-3.5 p-3.5 rounded-2xl bg-obsidian-950/90 border ${i === 0 ? 'border-gold-400 shadow-gold-glow' : 'border-zinc-800'}">
                      <div class="w-9 h-9 rounded-xl flex items-center justify-center font-mono font-black text-sm ${i === 0 ? 'gold-btn' : 'bg-obsidian-800 text-gold-400'}">
                        #${i + 1}
                      </div>
                      <img src="${leader.avatar}" class="w-11 h-11 rounded-xl object-cover bg-obsidian-800" />
                      <div class="min-w-0 flex-1">
                        <p class="text-sm font-bold text-white truncate">${leader.name}</p>
                        <p class="text-xs text-zinc-400">${leader.workMode}</p>
                      </div>
                      <span class="font-mono font-black text-sm text-gold-400">${leader.score}/60</span>
                    </div>
                  `).join("")}
                </div>
              </div>
            </section>
          ` : ''}

          <!-- MEMBER TAB 4: PROFILE & CV -->
          ${activeTab === 'profile' ? `
            <section class="glass-card rounded-2xl p-6 md:p-8 max-w-3xl mx-auto animate-enter">
              <div class="flex flex-col sm:flex-row items-center gap-5 pb-6 border-b border-gold-500/20 mb-6">
                <div class="relative">
                  <img src="${me.avatar}" class="w-24 h-24 rounded-2xl object-cover border-2 border-gold-500 shadow-gold-glow bg-obsidian-950" />
                  <label class="absolute -bottom-2 -left-2 p-2 rounded-xl gold-btn cursor-pointer shadow-lg" title="تغيير الصورة الشخصية">
                    <i data-lucide="camera" class="w-4 h-4"></i>
                    <input type="file" accept="image/*" onchange="handleMemberAvatarChange(this)" class="hidden" />
                  </label>
                </div>
                <div class="text-center sm:text-right">
                  <h2 class="text-xl font-black text-white">${me.name}</h2>
                  <p class="text-xs font-mono text-gold-400 mb-2">Academic ID: ${me.academicId}</p>
                  ${getWorkModeBadge(me.workMode)}
                </div>
              </div>

              <form onsubmit="saveMyProfile(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-gold-300 mb-1.5">نظام الشغل والتخصص</label>
                    <select id="prof-workmode" class="w-full bg-obsidian-950 border border-zinc-800 focus:border-gold-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">
                      <option value="Software" ${me.workMode === 'Software' ? 'selected' : ''}>Software (سوفت وير)</option>
                      <option value="Hardware" ${me.workMode === 'Hardware' ? 'selected' : ''}>Hardware (هاردوير)</option>
                      <option value="Both" ${me.workMode === 'Both' ? 'selected' : ''}>Both (الاتنين مع بعض)</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gold-300 mb-1.5">رابط البورتفوليو / GitHub / LinkedIn</label>
                    <input id="prof-portfolio" type="url" value="${me.portfolio || ''}" placeholder="https://..." class="w-full bg-obsidian-950 border border-zinc-800 focus:border-gold-500 rounded-xl px-3.5 py-2.5 text-sm text-white font-mono outline-none" />
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-gold-300 mb-1.5">المهارات التقنية (Skills)</label>
                  <input id="prof-skills" type="text" value="${me.skills || ''}" class="w-full bg-obsidian-950 border border-zinc-800 focus:border-gold-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
                </div>

                <div>
                  <label class="block text-xs font-bold text-gold-300 mb-1.5">السيرة الذاتية والخبرات (Bio & CV)</label>
                  <textarea id="prof-bio" rows="4" class="w-full bg-obsidian-950 border border-zinc-800 focus:border-gold-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">${me.bio || ''}</textarea>
                </div>

                <div class="flex justify-end pt-2">
                  <button type="submit" class="gold-btn px-7 py-3 rounded-xl text-sm flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    حفظ التعديلات على البروفايل
                  </button>
                </div>
              </form>
            </section>
          ` : ''}
        </main>
      `;
    }

    // ==========================================
    // 10. MAIN RENDER LOOP
    // ==========================================
    function render() {
      const appEl = document.getElementById("app");
      if (!currentUser) {
        appEl.innerHTML = renderAuthScreen();
      } else if (currentUser.role === "admin") {
        appEl.innerHTML = renderAdminDashboard();
      } else {
        appEl.innerHTML = renderMemberDashboard();
      }
      if (window.lucide) lucide.createIcons();
    }

    // Initialize immediately on load
    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>
</html>
